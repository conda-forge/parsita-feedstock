{% set name = "parsita" %}
{% set version = "2.3.1" %}
{% set python_version = "3.11" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/parsita-{{ version }}.tar.gz
  sha256: 24e93da8a249c0cdcf44b7cd07dda24251c7199453792fd0cb6e147555fe3636

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python {{ python_version }}
    - uv-build >=0.13,<0.14
    - pip
  run:
    - python >={{ python_version }}
    - returns >=0.20.0,<0.31

test:
  requires:
    - python {{ python_version }}
    - pip
  imports:
    - parsita
  commands:
    - pip check

about:
  home: https://parsita.drhagen.com/
  summary: Parser combinator library for Python
  license: MIT
  license_file: LICENSE
  doc_url: https://parsita.drhagen.com/
  dev_url: https://github.com/drhagen/parsita/

extra:
  recipe-maintainers:
    - drhagen
